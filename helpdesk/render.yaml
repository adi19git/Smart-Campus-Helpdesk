databases:
  - name: helpdesk-db
    databaseName: helpdesk
    user: helpdesk_user

services:
  - type: web
    name: helpdesk-backend
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn helpdesk.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: helpdesk-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"

  - type: web
    name: helpdesk-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/build"
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: helpdesk-backend
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

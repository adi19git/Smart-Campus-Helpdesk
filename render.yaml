databases:
  - name: helpdesk-db
    plan: free
    databaseName: helpdesk
    user: helpdesk_user

services:
  # ── Django Backend ──────────────────────────────────────────────
  - type: web
    name: helpdesk-backend
    env: python
    plan: free
    rootDir: helpdesk
    buildCommand: "./build.sh"
    startCommand: "gunicorn helpdesk.wsgi:application"

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: helpdesk-db
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      - key: ALLOWED_HOSTS
        value: ".onrender.com"

      - key: CORS_ALLOWED_ORIGINS
        value: "https://smart-campus-helpdesk-a548.vercel.app"

      - key: CSRF_TRUSTED_ORIGINS
        value: "https://smart-campus-helpdesk-a548.vercel.app"

      - key: PYTHON_VERSION
        value: "3.12.3"

  # ── React Frontend (Static Site) ────────────────────────────────
  - type: web
    runtime: static
    name: helpdesk-frontend
    rootDir: helpdesk/frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./build"

    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: helpdesk-backend
          envVarKey: RENDER_EXTERNAL_URL

    routes:
      - type: rewrite
        source: /*
        destination: /index.html
# ─── Render Blueprint ────────────────────────────────────────────────
# Defines the infrastructure for the Smart Campus Helpdesk backend.
# Frontend is deployed separately on Vercel.
#
# Deploy via: https://render.com/deploy → connect your GitHub repo
# ─────────────────────────────────────────────────────────────────────

databases:
  - name: helpdesk-db
    plan: free
    databaseName: helpdesk
    user: helpdesk_user

services:
  - type: web
    name: helpdesk-backend
    runtime: python
    plan: free
    rootDir: helpdesk
    buildCommand: "./build.sh"
    startCommand: "gunicorn helpdesk.wsgi:application --bind 0.0.0.0:$PORT"

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: helpdesk-db
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      - key: RENDER
        value: "true"

      - key: PYTHON_VERSION
        value: "3.12.3"

      - key: ALLOWED_HOSTS
        value: ".onrender.com"

      - key: CORS_ALLOWED_ORIGINS
        value: "https://smart-campus-helpdesk-a548.vercel.app"

      - key: CSRF_TRUSTED_ORIGINS
        value: "https://smart-campus-helpdesk-a548.vercel.app"

      - key: ADMIN_PASSWORD
        value: "Admin@2026!"

      - key: STUDENT_PASSWORD
        value: "Student@2026!"
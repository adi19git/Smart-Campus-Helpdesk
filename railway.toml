[[services]]
name = "helpdesk-backend"
cmd = "cd helpdesk && gunicorn helpdesk.wsgi:application"
buildCommand = "./build.sh"

[[services.envVars]]
key = "DEBUG"
value = "False"

[[services.envVars]]
key = "ALLOWED_HOSTS"
value = "*"

[[services.envVars]]
key = "CORS_ALLOW_ALL_ORIGINS"
value = "True"

[[services.envVars]]
key = "PORT"
value = "8000"

[[databases]]
name = "helpdesk-postgres"
engine = "postgres"

[[services]]
name = "helpdesk-frontend"
cmd = "npm run build && npx serve -s build -l 3000"
buildCommand = "npm install"
workingDirectory = "helpdesk/frontend"
